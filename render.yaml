services:
  - type: web
    name: gemelo-digital-microclimatico
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFLOW_FLOW_ID
        value: 5948dff7-734a-4820-b301-9c1632f078fc
